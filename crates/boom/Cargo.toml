[package]
name = "boom"
version.workspace = true
edition.workspace = true
description = "A ledger of what a project has claimed about itself, with every view of it computed and a check that reads the work against the claims that stand."
publish = false

[[bin]]
name = "boom"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
globset = { version = "0.4.21", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false, features = [
  "html",
] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256"] }
tiny_http = "0.12.0"
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
ed25519-dalek = "3.0.0"
tempfile = "3.27.0"
