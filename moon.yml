$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: what spans the tree, each check one task
# (core.5).
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.5).
  format:
    command: 'treefmt --ci'
    inputs: ['/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy and rustfmt are the build .prototools pins, and
  # OpenSpec and Vale, which the pages' writers run, and the plugin's
  # Claude Code and jq, the releases devenv.nix pins, on whichever host
  # runs the gate (core.6). It reads the tools it checks from outside the
  # tree, so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # Every spec under openspec/specs passes openspec validate --strict, which
  # fails a warning as an error, by the openspec devenv.nix pins (core.6).
  # It sends no usage statistics and asks for no newer release.
  specs:
    command: 'openspec validate --specs --strict --no-interactive'
    env: {OPENSPEC_TELEMETRY: '0', OPENSPEC_NO_UPDATE_CHECK: '1'}
    inputs: ['/openspec/specs/**/*', '/openspec/config.yaml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every open change under openspec/changes passes the same strict
  # validation, and archives cleanly: openspec archive applies its deltas,
  # alone, to a scratch copy of the specs, and each spec it writes passes
  # openspec validate --strict (check-changes.sh; record 0004, core.7).
  # The specs are read and rebuilt, so they are inputs too; the archived
  # changes are not.
  changes:
    command: 'sh check-changes.sh'
    inputs: ['/openspec/changes/**/*', '!/openspec/changes/archive/**/*', '/openspec/specs/**/*', '/openspec/config.yaml', '/check-changes.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # check-changes.sh does what core.7 asks of each open change: its cases,
  # each a scratch tree of its own holding the changes it names as data,
  # check its exit and its words, so a change to the script that lets
  # through a change archive refuses, or a requirement past OpenSpec's 500
  # characters, fails here (check-changes-cases.sh, Flume's copied; record
  # 0004, point 7, core.7). It reads nothing of the tree but the scripts.
  changes-cases:
    command: 'sh check-changes-cases.sh'
    inputs: ['/check-changes.sh', '/check-changes-cases.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The marketplace at the tree's root, listing the plugin by its folder and
  # with no version, read by the pinned Claude Code through
  # plugins/claude.sh (design 8, 9).
  marketplace:
    command: 'bash plugins/claude.sh plugin validate --strict .'
    inputs: ['/.claude-plugin/marketplace.json', '/plugins/claude-code/**/*', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every file that carries boom's version gives 0.0.0, the workspace's; the
  # marketplace names none; every plugin manifest is among the files
  # set-version.sh writes; and the writer, run on a scratch copy, writes a
  # release's version into each and changes nothing else, and refuses a
  # version that is not one and a file with none, writing nothing
  # (check-versions.sh; record 0010, design 2; core.8). jq is devenv's.
  versions:
    command: 'sh check-versions.sh'
    inputs: ['/Cargo.toml', '/Cargo.lock', '/plugins/claude-code/.claude-plugin/plugin.json', '/.claude-plugin/marketplace.json', '/plugins/*/.claude-plugin/plugin.json', '/set-version.sh', '/check-versions.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The workflow releases as record 0010 has it: only a landing, reckoned
  # from the newest tag; the binaries built from the release's tree with
  # nothing given, by cargo, and run on a runner with no Nix, Linux's
  # against musl; the release commit and its tag pushed alone
  # (check-release.sh; design 5; core.8). yamlfmt, under format, lays the
  # workflow out; this reads what a release's steps must be.
  release:
    command: 'sh check-release.sh'
    inputs: ['/.github/workflows/release.yml', '/check-release.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
