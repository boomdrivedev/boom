$schema: 'https://moonrepo.dev/schemas/project.json'

# boom's Claude Code plugin: its manifest, its session hook, which runs
# boom query --if-declared (design 8), and its write hook, which runs boom
# terms check --hook --if-declared (term-check). Each check is one task, in
# the fast layer (core.5).
language: 'bash'
layer: 'application'

tasks:
  # The plugin's JSON, by Biome with the settings /biome.json holds, which
  # treefmt formats it by too (core.5).
  format:
    command: 'biome format .'
    inputs: ['.claude-plugin/**/*', 'hooks/**/*', '/biome.json', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  lint:
    command: 'biome lint .'
    inputs: ['.claude-plugin/**/*', 'hooks/**/*', '/biome.json', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The manifest and its hooks, read by the pinned Claude Code (design 9).
  typecheck:
    command: '../claude.sh plugin validate --strict .'
    inputs: ['.claude-plugin/**/*', 'hooks/**/*', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
  # The session hook and the write hook, each run as Claude Code runs it,
  # with a boom of its own and with the boom the tree builds (design 9;
  # term-check).
  test:
    script: 'bash tests/session.sh && bash tests/write.sh'
    inputs: ['.claude-plugin/**/*', 'hooks/**/*', 'tests/**/*', '/crates/boom/**/*', '/Cargo.toml', '/Cargo.lock', '/.prototools', '/rust-toolchain.toml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
