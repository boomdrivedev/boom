inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # flume's tree at a release, read for its site/packages.nix alone: flume
  # owns how a site's packages reach a sandboxed gate (its record 0059;
  # record 0003).
  flume:
    url: github:boomdrivedev/flume/v0.24.0
    flake: false
