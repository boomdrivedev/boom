# The site's prose and the README, for their writers to check. The rules
# are styles/Boom, sounding's, copied from the design books' voice in
# agentplot/blueprints (books/VOICE.md): present tense, the actor as the
# subject, nothing sold, nothing hedged. `prose` from the devenv shell
# runs them; no task or workflow does (core.5; record 0002).
StylesPath = styles
Vocab = Boom
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Boom
Vale.Spelling = NO
# Starlight's directives, import lines and component tags are not prose.
TokenIgnores = (:::[a-z]+(?:\[[^\]]*\])?), (^import .*$), (<[A-Z][A-Za-z]*[^>]*/?>), (</[A-Z][A-Za-z]*>)
