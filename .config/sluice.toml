# sluice gates every merge onto main: the checks moon tags, in
# boom's devenv shell, main on GitHub as the sluice app lands
# it. The layers are .moon/workspace.yml's.
# Every merge into a bolt is gated on main's checks too; crew makes
# each bolt on GitHub with `sluice branch create`, and it lands into
# main by sluice.
[tests]
runner = "moon"
toolchain = ["devenv", "print-dev-env"]

[executor]
kind = "sandbox"
# Nothing the checks run reaches past the host.
network = "localhost"

# The one signer whose runs the gates count, as in sluice's own policy:
# deneb, where the sessions run and submit, signing as sessions with its
# own key. Naming a signer keeps every branch with a remote on it, its
# state there beside the branch, so the host that keeps main on origin
# takes main's pull requests in (sluice's record 0125).
[signers.sessions]
ssh = "deneb ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHGx/Ip3yodP/Rg3DdMAjJXoYuBmMxTLpPrka3ei69M/ sluice deneb"

# A bolt is gated as main is, and trusts the replays main trusts.
[branches."bolt/*"]
required = ["#check-fast"]
trust = ["sessions"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

# A replay counts on main only when a run deneb signed recorded a pass
# for its key: the cache also holds what open shells ran.
[branches.main]
required = ["#check-fast"]
trust = ["sessions"]
parallel = 2
batch = false
flaky = "fail"
timeout = "10m"
remote = "origin"

[branches.main.pull_requests]
reviews = 0
