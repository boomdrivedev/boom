# moon runs boom's checks: one project per crate, one per plugin, one for
# the flake and one for the site, each holding its own checks, and the
# root, holding what spans the tree (core.5). Each check is tagged with its layer, which a branch's policy
# requires by tag (.config/sluice.toml):
#   check-fast    the crate's format, lint, type check and tests; the
#                 site's format, lint, type check, diagrams and build; the
#                 root's format, toolchain, specs, changes and the
#                 changes check's cases. main requires it
# No task reads a Markdown file for its words: a page, a README or a record
# is kept by its writers (core.5; record 0002).
# A task whose inputs are identical to a run that passed on this host, in
# any worktree, replays from .moon/cache/outputs (a link into the git common
# dir, made by devenv.nix) instead of running again.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  boom: 'crates/boom'
  claude-code: 'plugins/claude-code'
  nix: 'nix'
  site: 'site'
  root: '.'

# --affected compares against the merge-base with main.
vcs:
  client: 'git'
  defaultBranch: 'main'

telemetry: false
